<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git ls-tree</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="top-section">
            <button id="importBtn">Import from clipboard</button>
            <button id="clearBtn">Clear</button>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="filter... e: {exact}, f: {fuzzy}, !: {exclude}, a/b: {child}">
                <input type="number" id="depthInput" placeholder="Depth" min="1" max="100">
                <button id="filterBtn">Filter</button>
            </div>
            <div class="toggle-group">
                <label class="toggle">
                    <input type="checkbox" id="commentToggle">
                    <span>Comment</span>
                </label>
                <label class="toggle">
                    <input type="checkbox" id="trailingToggle" checked>
                    <span>Trailing</span>
                </label>
            </div>
            <button id="copyBtn">Copy</button>
        </header>

        <main class="middle-section">
            <textarea id="inputText" placeholder="Enter your flat list here..."></textarea>
            <div id="outputText" class="output-panel"></div>
        </main>

        <footer class="bottom-section">
            <span class="app-info">Last deployed on 2026/09/14 at 22:55:01</span>
            <a href="https://github.com/oclockvn/git-ls-tree/" class="github-link">View the source on GitHub</a>
        </footer>
    </div>

    <div id="filterBackdrop" class="filter-backdrop"></div>
    <aside id="filterPanel" class="filter-panel">
        <div class="filter-panel-header">
            <span>Filter folders</span>
            <button id="filterCloseBtn" class="filter-close-btn" aria-label="Close">&times;</button>
        </div>
        <div class="filter-panel-actions">
            <button id="filterSelectAllBtn">Select all</button>
            <button id="filterClearAllBtn">Clear all</button>
        </div>
        <div id="filterTreeContainer" class="filter-tree-container"></div>
    </aside>

    <script src="app.js"></script>
</body>
</html>
